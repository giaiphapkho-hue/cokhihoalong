<!-- SCRIPT XỬ LÝ MENU HOẠT ĐỘNG NGAY CẢ KHU LOAD FETCH DỘNG -->
<script>
    (function initHeaderLogic() {
        const mobileMenuBtn = document.getElementById('mobileMenuBtn');
        const mainNav = document.getElementById('mainNav');
        const menuIcon = document.getElementById('menuIcon');

        if (mobileMenuBtn && mainNav) {
            // Đảm bảo không bị gán trùng lặp event listener
            mobileMenuBtn.replaceWith(mobileMenuBtn.cloneNode(true));
            const newMobileMenuBtn = document.getElementById('mobileMenuBtn');
            const newMenuIcon = document.getElementById('menuIcon');

            // Toggle Mobile Menu
            newMobileMenuBtn.addEventListener('click', function(e) {
                e.stopPropagation();
                mainNav.classList.toggle('active');
                if (mainNav.classList.contains('active')) {
                    newMenuIcon.classList.remove('fa-bars');
                    newMenuIcon.classList.add('fa-xmark');
                } else {
                    newMenuIcon.classList.remove('fa-xmark');
                    newMenuIcon.classList.add('fa-bars');
                }
            });

            // Xử lý click mở dropdown Sản phẩm trên Mobile
            const navItems = document.querySelectorAll('.nav-item');
            navItems.forEach(item => {
                const link = item.querySelector('.nav-link');
                const dropdown = item.querySelector('.dropdown-menu');
                
                if (dropdown && link) {
                    link.addEventListener('click', function(e) {
                        if (window.innerWidth <= 992) {
                            // Nếu bấm vào icon chevron hoặc bấm lần 1 thì mở dropdown
                            if (!item.classList.contains('open')) {
                                e.preventDefault();
                                item.classList.add('open');
                            }
                        }
                    });
                }
            });

            // Đóng mobile menu khi click bên ngoài
            document.addEventListener('click', function(e) {
                if (mainNav && mainNav.classList.contains('active') && !mainNav.contains(e.target) && !newMobileMenuBtn.contains(e.target)) {
                    mainNav.classList.remove('active');
                    newMenuIcon.classList.remove('fa-xmark');
                    newMenuIcon.classList.add('fa-bars');
                }
            });

            // Tự động Active link dựa trên URL
            const currentPath = window.location.pathname.split('/').pop() || 'index.html';
            const navLinks = document.querySelectorAll('.nav-link');
            navLinks.forEach(link => {
                const href = link.getAttribute('href');
                if (href === currentPath || (currentPath === '' && href === 'index.html')) {
                    link.classList.add('active');
                } else {
                    link.classList.remove('active');
                }
            });
        }
    })();
</script>
