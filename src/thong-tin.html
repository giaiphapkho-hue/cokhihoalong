<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thông Tin & Bài Viết Kỹ Thuật - Cơ Khí Hòa Long</title>
    <meta name="description" content="Cập nhật tin tức ngành kho vận, giải pháp tối ưu không gian nhà kho và tài liệu kỹ thuật từ Cơ Khí Hòa Long.">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #004b93; --accent: #ff6600; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Roboto', sans-serif; }
        body { color: #333; line-height: 1.6; }
        header { background: #fff; box-shadow: 0 2px 5px rgba(0,0,0,0.1); position: sticky; top: 0; z-index: 1000; }
        .container { width: 90%; max-width: 1200px; margin: auto; display: flex; justify-content: space-between; align-items: center; padding: 15px 0; }
        .logo { font-size: 22px; font-weight: 700; color: var(--primary); text-decoration: none; }
        nav a { margin-left: 20px; text-decoration: none; color: #333; font-weight: 500; }
        nav a:hover, nav a.active { color: var(--primary); font-weight: 700; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; margin-top: 30px; }
        .card { border: 1px solid #ddd; border-radius: 6px; overflow: hidden; background: #fff; }
        .card img { width: 100%; height: 180px; object-fit: cover; }
        .card-body { padding: 15px; }
        .card-title { font-size: 16px; font-weight: bold; color: var(--primary); margin-bottom: 10px; }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <a href="index.html" class="logo">CƠ KHÍ HÒA LONG</a>
            <nav>
                <a href="index.html">Trang chủ</a>
                <a href="gioi-thieu.html">Giới thiệu</a>
                <a href="san-pham.html">Sản phẩm</a>
                <a href="dich-vu.html">Dịch vụ</a>
                <a href="thong-tin.html" class="active">Thông tin</a>
                <a href="lien-he.html">Liên hệ</a>
            </nav>
        </div>
    </header>

    <div class="container" style="flex-direction: column; padding-top: 40px;">
        <h1 style="color: var(--primary);">TIN TỨC & BÀI VIẾT KỸ THUẬT</h1>
        <p>Đồng bộ trực tiếp từ Ban Biên Tập Nội Dung Hoa Long Mechanical</p>
        
        <div class="grid" id="rss-news-list" style="width: 100%;">
            <p>Đang tải bài viết mới nhất từ hoalongcorp.com...</p>
        </div>
    </div>

    <!-- Script tự động lấy bài từ hoalongcorp.com -->
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const rssUrl = 'https://hoalongcorp.com/feed/';
            const apiUrl = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(rssUrl)}`;

            fetch(apiUrl)
                .then(res => res.json())
                .then(data => {
                    if (data.status === 'ok') {
                        const container = document.getElementById('rss-news-list');
                        container.innerHTML = '';
                        
                        data.items.forEach(post => {
                            const card = document.createElement('div');
                            card.className = 'card';
                            const thumb = post.thumbnail || 'https://via.placeholder.com/400x200?text=HLM+Mechanical';
                            
                            card.innerHTML = `
                                <img src="${thumb}" alt="${post.title}">
                                <div class="card-body">
                                    <div class="card-title">${post.title}</div>
                                    <p style="font-size: 13px; color: #666;">${post.description.replace(/(<([^>]+)>)/gi, "").substring(0, 110)}...</p>
                                    <a href="${post.link}" target="_blank" style="color: var(--accent); font-weight: bold; text-decoration: none; display: inline-block; margin-top: 10px; font-size: 14px;">Xem bài viết gốc →</a>
                                </div>
                            `;
                            container.appendChild(card);
                        });
                    }
                })
                .catch(err => console.log('Không thể tải bài RSS:', err));
        });
    </script>
</body>
</html>
